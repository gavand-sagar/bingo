<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Night — play with friends</title>
<meta name="description" content="Free multiplayer games for your phone: BINGO, checkers, four-in-a-row, dots & boxes, dice, cards and more. Make a room, share the code, play.">
<meta name="theme-color" content="#1e1b4b">
<meta property="og:title" content="Game Night — play with friends">
<meta property="og:description" content="Multiplayer board, dice and card games. Share a room code and play on your phones.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f59e0b'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js" defer></script>
<script src="games/bingo.js" defer></script>
<script src="games/tictactoe.js" defer></script>
<script src="games/four.js" defer></script>
<script src="games/dots.js" defer></script>
<script src="games/checkers.js" defer></script>
<script src="games/yacht.js" defer></script>
<script src="games/eights.js" defer></script>
<script src="games/ludo.js" defer></script>
<script src="main.js" defer></script>
</head>
<body>
<main>
  <section id="home">
    <h1>Game&nbsp;Night</h1>
    <p class="sub">Board, dice &amp; card games with friends. One room, any phone.</p>
    <div class="card">
      <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
      <button id="create">Create room</button>
      <div class="row"><input id="joinCode" maxlength="4" placeholder="CODE" class="codein"><button id="join" class="alt">Join</button></div>
    </div>
    <div class="glist" id="homeGames"></div>
  </section>

  <section id="lobby" class="hidden">
    <div class="card">
      <p class="sub">Room code</p>
      <div class="code" id="codeTxt"></div>
      <button id="share" class="alt">Share invite link</button>
      <div class="players" id="lobbyPlayers"></div>
    </div>
    <p class="sub" id="pickHint"></p>
    <div class="glist" id="lobbyGames"></div>
    <button id="start" class="hidden sticky">Start</button>
    <p class="hint" id="lobbyHint"></p>
  </section>

  <section id="play" class="hidden">
    <div class="top"><button id="leave" class="ghost">✕</button><b id="gTitle"></b><span></span></div>
    <div class="players" id="chips"></div>
    <div class="banner" id="banner"></div>
    <div id="stage"></div>
    <div class="card hidden" id="overbar">
      <div class="win" id="winTxt"></div>
      <div class="row" id="hostBtns"><button id="again">Play again</button><button id="toLobby" class="alt">Other game</button></div>
      <p class="hint" id="overHint"></p>
    </div>
  </section>
</main>
<div class="toast hidden" id="toast"></div>
</body>
</html>
